# OCR Service Configuration - Using simple OCR (no external dependencies)
# ocr.service.type=mock

# Tesseract Configuration (when using real OCR)
tesseract.datapath=/usr/share/tesseract-ocr/4.00/tessdata
# For Windows: tesseract.datapath=C:\\Program Files\\Tesseract-OCR\\tessdata
tesseract.language=eng
tesseract.page.seg.mode=1
tesseract.ocr.engine.mode=1

# File Upload Configuration
app.file.upload-dir=uploads/kyc-documents
app.file.upload.max-size=10485760
app.file.upload.allowed-types=image/jpeg,image/jpg,image/png,image/gif,application/pdf

# KYC Verification Thresholds
kyc.verification.confidence.threshold=70
kyc.verification.risk.threshold=50
kyc.verification.manual-review.threshold=60
